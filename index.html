<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Counter App</title>
</head>
<body>
    <div class="main">

        <div id="home-score">
            <h1>Home</h1>
            <div class="home-scoreboard">
                <h2 id="home-score-counter" class="home-score-counter">0</h2>
            </div>
            <div class="home-score-buttons">
                <button id="home-score-1" class="home-score-1" onclick="homeScore1()">+1</button>
                <button id="home-score-2" class="home-score-2" onclick="homeScore2()">+2</button>
                <button id="home-score-3" class="home-score-3" onclick="homeScore3()">+3</button>
            </div>
        </div>

        <div id="guest-score">
            <h1>Guest</h1>
            <div class="guest-scoreboard">
                <h2 id="guest-score-counter" class="guest-score-counter">0</h2>
            </div>
            <div class="guest-score-buttons">
                <button id="guest-score-1" class="home-score-1" onclick="guestScore1()">+1</button>
                <button id="guest-score-2" class="home-score-2" onclick="guestScore2()">+2</button>
                <button id="guest-score-3" class="home-score-3" onclick="guestScore3()">+3</button>
            </div>
        </div>

    </div>

    <script src="index.js"></script>
</body>
</html>
